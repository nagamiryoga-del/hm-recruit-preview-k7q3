<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>応募フォーム｜株式会社榛原モータース（スズキアリーナ牧之原）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#30302e;--sub:#6b6b66;--pale:#e3e3e3;--line:#e6e4df;--bg:#fff;--warm:#f7f5f1;--dark:#30302e;--acc:#1f4fa8}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:2.1;letter-spacing:.05em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}
p,h1,h2,h3,li,dd,summary{text-wrap:pretty}
.en{font-family:Jost,sans-serif;letter-spacing:.04em}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px}
/* header */
.hd{position:fixed;top:20px;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:0 32px;pointer-events:none}
.hd>*{pointer-events:auto}
.logo{line-height:1.25}.logo b{display:block;font-size:19px;font-weight:700;letter-spacing:.12em}.logo small{display:inline-block;margin-top:6px;font-size:10.5px;background:var(--dark);color:#fff;padding:1px 8px;border-radius:3px;letter-spacing:.08em}
.nav{display:flex;gap:30px;background:#fff;border-radius:999px;padding:12px 34px;box-shadow:0 6px 24px rgba(0,0,0,.06);list-style:none}
.nav a{display:flex;flex-direction:column;align-items:center;line-height:1.5}
.nav .en{font-size:11.5px;font-weight:300;color:#999}.nav b{font-size:13.5px;font-weight:700}
.badge{width:96px;height:96px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;text-align:center;font-size:12.5px;font-weight:700;line-height:1.5}
/* MV */
.mv{position:relative;min-height:860px;padding-top:150px;overflow:hidden;background:linear-gradient(180deg,#fff 0%,var(--warm) 100%)}
.mv .wrap{position:relative;display:grid;grid-template-columns:1fr 1.1fr;gap:40px}
.mv h1 span{white-space:nowrap}.mv h1{font-size:50px;font-weight:700;line-height:1.55;letter-spacing:.08em;margin-top:80px}
.mv .lead{margin-top:28px;font-size:15px;font-weight:500;line-height:2.2;max-width:460px}
.mv-btns{display:flex;gap:14px;margin-top:40px}
.cbtn{display:flex;flex-direction:column;justify-content:center;width:240px;height:84px;padding:0 22px;border-radius:10px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.cbtn .en{font-size:11.5px;font-weight:400;line-height:1.4}.cbtn b{font-size:15px;line-height:1.6}
.cbtn::after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1}
.cbtn.dk{background:var(--dark);color:#fff}.cbtn.dk::after{background:rgba(255,255,255,.2)}
.cbtn.lt{background:#fff}.cbtn.lt::after{background:#efefef}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;height:760px;margin-top:-40px}
.col{display:flex;flex-direction:column;gap:18px}.col:nth-child(2){margin-top:110px}
.col div{border-radius:18px;overflow:hidden;flex:1}
/* section */
.sec{padding:115px 0}.warm{background:var(--warm)}
.st{text-align:center;margin-bottom:64px}
.st .en{display:block;font-size:84px;font-weight:600;color:var(--pale);line-height:1.1}
.warm .st .en{color:#e4e0d8}
.st h2{font-size:15px;font-weight:700;margin-top:-6px}
.st p{margin-top:22px;font-size:15px;font-weight:500}
/* message (kawamura style) */
.msg{display:grid;grid-template-columns:1.05fr 1fr;gap:70px;align-items:center}
.msg-ph{border-radius:20px;overflow:hidden;aspect-ratio:4/3}
.msg h3{font-size:30px;font-weight:700;line-height:1.7;margin-bottom:26px}
.msg p{font-size:15px;line-height:2.2}
.sign{margin-top:30px;text-align:right;font-size:13px}.sign b{font-size:19px;margin-left:14px;letter-spacing:.15em}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.about-ph{border-radius:20px;overflow:hidden;aspect-ratio:3/2}
.about p{font-size:16px;font-weight:500;line-height:2.3}
.nums{display:grid;grid-template-columns:repeat(4,1fr);margin-top:70px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nums div{padding:34px 10px;text-align:center}.nums div+div{border-left:1px solid var(--line)}
.nums b{display:block;font-family:Jost,"Noto Sans JP",sans-serif;font-size:40px;font-weight:400;line-height:1.3}
.nums span{display:block;margin-top:6px;font-size:13px;color:var(--sub)}
/* work */
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.work{background:#fff;border-radius:18px;overflow:hidden}
.work-ph{aspect-ratio:4/3}
.work-bd{padding:28px 28px 32px}
.work-no{font-family:Jost;font-size:13px;color:#999}
.work h3{font-size:21px;font-weight:700;margin:2px 0 12px}
.work-bd>p:not(.work-no){font-size:14px;line-height:2}
.merit{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.merit b{display:inline-block;font-size:13px;background:var(--dark);color:#fff;padding:2px 12px;border-radius:4px;margin-bottom:8px}
.merit span{display:block;font-size:13.5px;line-height:1.9;color:var(--sub)}
.flow{margin-top:56px;display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap}
.flow-t{font-size:14px;font-weight:700;margin-right:28px}
.flow ol{display:flex;list-style:none;counter-reset:f}
.flow li{counter-increment:f;font-size:14px;font-weight:700;padding:10px 26px;background:#fff;border-radius:999px;margin:0 6px;position:relative}
.flow li::before{content:"0" counter(f);font-family:Jost;font-weight:400;color:#999;margin-right:10px}
/* grow */
.grow{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.grow-ph{border-radius:20px;overflow:hidden;aspect-ratio:4/3}
.grow h3{font-size:26px;font-weight:700;margin-bottom:18px;line-height:1.6}
.grow p{font-size:15px}
.prevt{margin-top:30px;font-size:13px;font-weight:700}
.prev{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin-top:10px}
.prev li{font-size:13px;border:1px solid var(--line);background:#fff;padding:3px 14px;border-radius:999px}
/* band */
.band{height:480px;overflow:hidden}
/* env */
.envs{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;border-top:1px solid var(--line)}
.envs li{padding:34px 26px 38px;border-bottom:1px solid var(--line)}
.envs li:not(:nth-child(4n+1)){border-left:1px solid var(--line)}
.envs .no{font-family:Jost;font-size:13px;color:#999}
.envs h3{font-size:17px;font-weight:700;margin:6px 0 8px}
.envs p{font-size:13.5px;line-height:1.95;color:var(--sub)}
/* member */
.mems{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 26px}
.mem-ph{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:visible}
.mem-ph img{border-radius:18px}
.mem.noph .mem-ph{background:#e9e6e0;display:grid;place-items:center}
.mem .ini{font-size:54px;font-weight:700;color:#bdb8ae}
.bubble{position:absolute;left:-8px;right:12px;bottom:-22px;background:var(--dark);color:#fff;font-size:13.5px;font-weight:700;line-height:1.7;padding:12px 16px;border-radius:12px}
.mem-job{margin-top:16px;font-size:12px;color:var(--sub);line-height:1.6}
.mem-name{font-size:19px;font-weight:700;line-height:1.5}
.mem-prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--sub);line-height:1.7}
details{margin-top:12px;border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;padding:12px 0;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:#999}details[open] summary::after{content:"－"}
dt{font-size:12.5px;font-weight:700;margin-top:6px}dd{font-size:13px;line-height:1.95;color:var(--sub)}
/* recruit */
.jobs{border-top:1px solid var(--ink)}
.job{display:grid;grid-template-columns:240px 1fr;gap:20px;padding:30px 10px;border-bottom:1px solid var(--line);align-items:center}
.job b{font-size:18px;font-weight:700}.job span{font-size:14px;color:var(--sub)}
.steps{list-style:none;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:44px}
.steps li{font-size:14px;font-weight:700;padding:10px 24px;border-radius:999px;background:var(--warm)}
.steps{gap:34px}.steps li{position:relative}.steps li+li::before{content:"→";position:absolute;left:-25px;top:50%;transform:translateY(-50%);color:#bbb;font-weight:400}
.steps li.hl{background:var(--dark);color:#fff}
/* cta */
.cta{position:relative;padding:150px 0 130px;color:#fff;text-align:center;overflow:hidden}
.cta-bg{position:absolute;inset:0}.cta-bg::after{content:"";position:absolute;inset:0;background:rgba(30,30,28,.55)}
.cta .wrap{position:relative}
.cta h2{font-size:52px;font-weight:700;letter-spacing:.08em}
.cta p{margin:18px auto 0;max-width:620px;font-weight:500}
.cta-btns{display:flex;justify-content:center;gap:16px;margin-top:44px}
.cta .cbtn{width:300px;height:96px;text-align:left;color:var(--ink)}.cta .cbtn.dk{color:#fff}
.telnote{font-size:11px;line-height:1.5;color:var(--sub)}.cta .cbtn{height:110px}.cta .tel{font-family:Jost;font-size:24px;font-weight:400;line-height:1.3}
footer{background:var(--dark);color:#fff;padding:60px 0 40px;font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
footer .logo small{background:#fff;color:var(--dark)}
/* motion */
.js .rv{opacity:0;transform:translateY(30px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}.js .rv.in{opacity:1;transform:none}
.js .mv h1,.js .mv .lead,.js .mv-btns{opacity:0;transform:translateY(16px);animation:up 1s cubic-bezier(.2,.7,.2,1) forwards}
.js .mv .lead{animation-delay:.2s}.js .mv-btns{animation-delay:.35s}
.js .cols{animation:drift 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{to{opacity:1;transform:none}}@keyframes drift{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.work,.cbtn{transition:transform .3s ease,box-shadow .3s ease}.work:hover,.cbtn:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
@media (prefers-reduced-motion:reduce){.js .rv,.js .mv h1,.js .mv .lead,.js .mv-btns,.js .cols{opacity:1;transform:none;animation:none;transition:none}}
@media (max-width:900px){
 .wrap{padding:0 16px}.hd{top:12px;padding:0 14px}.nav,.badge{display:none}.logo b{font-size:16px}
 .mv{min-height:0;padding:100px 0 60px}.mv .wrap{grid-template-columns:1fr}.mv h1{font-size:30px;margin-top:0}.steps{gap:30px 34px}
 .mv-btns{flex-direction:column}.cbtn{width:100%}
 .cols{height:420px;margin-top:20px;gap:10px}.col{gap:10px}.col:nth-child(2){margin-top:50px}
 .sec{padding:84px 0}.st{margin-bottom:40px}.st .en{font-size:46px}
 .msg,.about,.grow{grid-template-columns:1fr;gap:30px}.msg h3{font-size:22px}.grow h3{font-size:21px}
 .nums{grid-template-columns:1fr 1fr}.nums div:nth-child(3){border-left:0}.nums div:nth-child(n+3){border-top:1px solid var(--line)}.nums b{font-size:30px}
 .works{grid-template-columns:1fr}.flow{flex-direction:column;gap:12px}.flow-t{margin:0}.flow ol{flex-wrap:wrap;justify-content:center;gap:8px}
 .band{height:220px}
 .envs{grid-template-columns:1fr 1fr}.envs li{padding:22px 14px}.envs li:not(:nth-child(4n+1)){border-left:0}.envs li:nth-child(2n){border-left:1px solid var(--line)}
 .mems{grid-template-columns:1fr 1fr;gap:34px 14px}.bubble{font-size:12px;padding:8px 10px;left:-4px;right:4px}
 .job{grid-template-columns:1fr;gap:4px}
 .cta{padding:90px 0}.cta h2{font-size:30px}.cta-btns{flex-direction:column;align-items:center}.cta .cbtn{width:100%;max-width:340px}
}
.ib{display:inline-block}
h1,h2,h3,p,li,dd,dt,span,b{word-break:auto-phrase}.cta p{text-wrap:balance}
.nums{grid-template-columns:repeat(3,1fr)!important}.nums div:nth-child(n+4){border-top:1px solid var(--line)}.nums div:nth-child(4){border-left:0}
.nums b{font-size:36px}
.age{margin-top:60px;background:#fff;border-radius:18px;padding:40px 48px}
.age h3{font-size:20px;font-weight:700}.age>p{font-size:14px;color:var(--sub);margin:6px 0 22px}
.age ul{list-style:none;display:grid;gap:12px}
.age li{display:grid;grid-template-columns:90px 1fr 56px;align-items:center;gap:16px;font-size:14px}
.ab{height:14px;background:#f0ede7;border-radius:99px;overflow:hidden}.ab i{display:block;height:100%;background:var(--dark);border-radius:99px}
.an{font-family:Jost,"Noto Sans JP";font-size:16px;text-align:right}
.age small{display:block;margin-top:18px;font-size:12px;color:var(--sub)}
.flow2{margin-top:64px;background:#fff;border-radius:18px;padding:36px 44px}
.flow2 .flow-t{font-size:16px;font-weight:700;margin-bottom:14px}
.flow2 ol{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.flow2 li{padding:6px 22px;border-left:1px solid var(--line);display:flex;flex-direction:column}.flow2 li:first-child{border-left:0;padding-left:0}
.ft{font-family:Jost,"Noto Sans JP";font-size:26px;font-weight:400;line-height:1.4}.fn{font-size:15px;font-weight:700;margin-top:2px}.fd{font-size:13px;color:var(--sub);line-height:1.9;margin-top:4px}
@media (max-width:900px){.nums{grid-template-columns:1fr 1fr!important}.nums div{border-left:0!important;border-top:1px solid var(--line)}.nums div:nth-child(2n){border-left:1px solid var(--line)!important}
.age{padding:26px 20px}.age li{grid-template-columns:70px 1fr 44px;gap:10px}
.flow2{padding:26px 20px}.flow2 ol{grid-template-columns:1fr}.flow2 li{border-left:0;padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:70px 1fr;column-gap:12px}.flow2 li:first-child{border-top:0}.ft{font-size:20px;grid-row:1/3}}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:240px;gap:14px}.gal div{border-radius:16px;overflow:hidden}.gal .g1{grid-row:span 2}
.steps li{background:#fff}
@media (max-width:900px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:140px;gap:8px}.gal .g1{grid-column:span 2;grid-row:span 2}}
.fvph{display:flex;flex-direction:column;gap:18px;margin-top:-20px}.fvph div{border-radius:18px;overflow:hidden;aspect-ratio:16/10}.fvph .a{width:92%}.fvph .b{width:80%;margin-left:20%}
.js .fvph{animation:drift 1.4s cubic-bezier(.2,.7,.2,1) both}
@media (max-width:900px){.fvph{margin-top:24px;gap:10px}.fvph .a{width:100%}.fvph .b{width:88%;margin-left:12%}}
.nums2{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:64px}
.nums2 div{background:#fff;border-radius:14px;padding:26px 28px 24px;display:flex;flex-direction:column;gap:6px}
.nums2 .nl{font-size:13px;font-weight:700;color:var(--sub);padding-left:12px;border-left:3px solid var(--dark);line-height:1.4}
.nums2 b{font-family:"Noto Sans JP",sans-serif;font-size:44px;font-weight:700;letter-spacing:.02em;line-height:1.3}
.nums2 b small{font-size:18px;font-weight:700;margin-left:4px}.nums2 b small.pre{margin:0 4px 0 0}
@media (max-width:900px){.nums2{grid-template-columns:1fr 1fr;gap:10px;margin-top:40px}.nums2 div{padding:18px 16px}.nums2 b{font-size:32px}.nums2 b small{font-size:14px}}
.mems{grid-template-columns:repeat(4,minmax(0,1fr))!important}
@media (max-width:900px){.mems{grid-template-columns:repeat(2,minmax(0,1fr))!important}.mem-prev{white-space:normal!important;min-height:3.4em}}
.cta-bg::after{background:rgba(28,28,26,.66)!important}.cta h2,.cta p{text-shadow:0 2px 12px rgba(0,0,0,.35)}

.form{max-width:720px;margin:0 auto;background:var(--warm);border-radius:20px;padding:44px 48px;display:grid;gap:22px}
.frow{display:grid;gap:8px}
.flab{font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px}
.flab em{font-style:normal;font-size:11px;font-weight:700;padding:1px 8px;border-radius:4px;letter-spacing:.05em}
.flab .req{background:var(--dark);color:#fff}.flab .opt{background:#fff;color:var(--sub);border:1px solid var(--line)}
.form input[type=text],.form input[type=tel],.form input[type=email],.form textarea{width:100%;font:inherit;font-size:16px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.form input:focus,.form textarea:focus{outline:2px solid var(--dark);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:10px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:700;cursor:pointer}
.chip input:checked+span{background:var(--dark);color:#fff;border-color:var(--dark)}
.priv{font-size:12px;color:var(--sub);text-align:center}
.fbtn{justify-self:center;width:280px;height:62px;border:0;border-radius:10px;background:var(--dark);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.thanks{max-width:720px;margin:0 auto;background:var(--warm);border-radius:20px;padding:48px;text-align:center}
.thanks h3{font-size:22px;margin-bottom:10px}
@media (max-width:900px){.form{padding:26px 18px;gap:18px}.fbtn{width:100%}.thanks{padding:32px 20px}}
.entry-page{padding-top:150px;min-height:100vh}.back{text-align:center;margin-top:28px;font-size:14px}.back a{text-decoration:underline;text-underline-offset:4px}
@media (max-width:900px){.entry-page{padding-top:100px}}
</style>
<script>
document.documentElement.classList.add('js');
addEventListener('DOMContentLoaded',function(){
 var els=document.querySelectorAll('.st,.msg>*,.about>*,.nums2 div,.work,.flow2,.age,.gal div,.grow>*,.envs li,.mem,.job,.steps,.cta .wrap>*');
 els.forEach(function(el){el.classList.add('rv');var i=[].indexOf.call(el.parentElement.children,el);el.style.transitionDelay=Math.min(i,5)*90+'ms';});
 if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return;}
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{rootMargin:'0px 0px -8% 0px'});
 els.forEach(function(e){io.observe(e)});
});
</script>
<script>
addEventListener('DOMContentLoaded',function(){
 var f=document.getElementById('entryForm'); if(!f) return;
 f.addEventListener('submit',function(ev){
  ev.preventDefault();
  var done=function(){f.hidden=true;document.getElementById('thanks').hidden=false;document.getElementById('apply').scrollIntoView({behavior:'smooth'});};
  if(f.action.indexOf('FORM_ENDPOINT')>=0){done();return;}
  fetch(f.action,{method:'POST',body:new FormData(f),headers:{'Accept':'application/json'}}).then(function(r){if(r.ok)done();else alert('送信できませんでした。お電話でもご応募いただけます（0548-24-0800）');}).catch(function(){alert('送信できませんでした。お電話でもご応募いただけます（0548-24-0800）');});
 });
});
</script>

<header class="hd">
 <a class="logo" href="index.html"><b>榛原モータース</b><small>採用情報</small></a>
 <ul class="nav">

  <li><a href="index.html#work"><span class="en">WORK</span><b>仕事内容</b></a></li>
  <li><a href="index.html#env"><span class="en">ENVIRONMENT</span><b>働く環境</b></a></li>
  <li><a href="index.html#member"><span class="en">MEMBER</span><b>社員インタビュー</b></a></li>

 </ul>
